name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build web directory for Capacitor
        run: npm run build

      - name: Add Android platform and Sync
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
          # Copia recursos visuais (ícones, layouts, xml de widget, som)
          cp -r android-res/drawable* android/app/src/main/res/ 2>/dev/null || true
          cp -r android-res/mipmap* android/app/src/main/res/ 2>/dev/null || true
          cp -r android-res/values android/app/src/main/res/ 2>/dev/null || true
          cp -r android-res/layout android/app/src/main/res/ 2>/dev/null || true
          cp -r android-res/xml android/app/src/main/res/ 2>/dev/null || true
          cp -r android-res/font android/app/src/main/res/ 2>/dev/null || true
          mkdir -p android/app/src/main/res/raw
          cp android-res/raw/eex_notification.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
          # Substitui arquivos nativos e componentes do widget
          cp android-overrides/*.java android/app/src/main/java/com/elgaly/express/ 2>/dev/null || true
          cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp android-overrides/app-build.gradle android/app/build.gradle
          cp android-overrides/variables.gradle android/variables.gradle
          cp google-services.json android/app/google-services.json
        env:
          CI: true

      - name: Setup release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/elgaly-release.keystore
          echo "✅ Keystore decodificada em android/app/elgaly-release.keystore"

      - name: Setup consistent debug keystore
        run: |
          mkdir -p ~/.android
          cp android-overrides/debug.keystore ~/.android/debug.keystore
          cp android-overrides/debug.keystore android/app/debug.keystore

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK (assinado com keystore oficial)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"
          KEYSTORE_PATH: "${{ github.workspace }}/android/app/elgaly-release.keystore"
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/express.elgaly.apk

      - name: Verify APK signature
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/release/express.elgaly.apk || true

      - name: Read app version
        id: read_version
        run: |
          VERSION=$(node -e "const v=require('./version.json'); console.log(v.version);")
          TAG="v${VERSION}-build${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "📦 Versão: $VERSION  |  Tag: $TAG"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elgaly-express-release-apk
          path: android/app/build/outputs/apk/release/express.elgaly.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.read_version.outputs.tag }}
          name: "Elgaly Express ${{ steps.read_version.outputs.tag }}"
          body: |
            ## 🚀 Atualização Automática da Frota EEX

            **Versão:** `${{ steps.read_version.outputs.version }}`
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Assinatura:** Release Keystore Oficial EEX ✅

            ### Instalação
            1. Baixe o arquivo `express.elgaly.apk` abaixo
            2. Abra o APK no seu Android
            3. Habilite "Fontes desconhecidas" se solicitado
            4. Instale e aproveite! 🎉

            > Atualização automática detectada pelo sistema da Providente no app.
          files: android/app/build/outputs/apk/release/express.elgaly.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### ✅ APK Release Gerado e Assinado!" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ steps.read_version.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Arquivo:** \`express.elgaly.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "**Assinatura:** Release Keystore Oficial EEX 🔐" >> $GITHUB_STEP_SUMMARY
