name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build web directory for Capacitor
        run: npm run build

      - name: Add Android platform and Sync
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
          cp -r android-res/* android/app/src/main/res/
          cp android-overrides/MainActivity.java android/app/src/main/java/com/elgaly/express/MainActivity.java
          cp android-overrides/app-build.gradle android/app/build.gradle
          cp android-overrides/variables.gradle android/variables.gradle
          cp google-services.json android/app/google-services.json
        env:
          CI: true

      - name: Setup consistent debug keystore
        run: |
          mkdir -p ~/.android
          cp android-overrides/debug.keystore ~/.android/debug.keystore
          cp android-overrides/debug.keystore android/app/debug.keystore

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Verify APK signature SHA-1
        run: |
          keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: elgaly-express-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🚀 APK Gerado com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "Baixe o arquivo **elgaly-express-debug-apk** na seção de Artifacts deste workflow." >> $GITHUB_STEP_SUMMARY
